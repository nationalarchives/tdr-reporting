name: TDR Run Reporting
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment: Choose prod for live data'
        required: true
        type: choice
        options:
          - intg
          - staging
          - prod
        default: 'intg'
      reportType:
        description: 'Report type'
        required: true
        type: choice
        options:
          - standard
          - caselaw
          - fileCheckFailures
        default: 'standard'
      consignmentId:
        description: 'Consignment ID (optional, for file check failures only)'
        required: false
        type: string
      startDateTime:
        description: 'Start date (YYYY-MM-DDTHH:MM:SSZ, optional, for file check failures only)'
        required: false
        type: string
      endDateTime:
        description: 'End date (YYYY-MM-DDTHH:MM:SSZ, optional, for file check failures only)'
        required: false
        type: string
permissions:
  # Only grant id-token:write if OIDC-based AWS authentication is used in this job.
  # If AWS credentials come from repository secrets instead, remove id-token:write entirely.
  id-token: write
  contents: read # Downgrade to read unless a step genuinely pushes a commit or tag
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - id: role-name
        env:
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          import os
          env = os.environ['INPUT_ENVIRONMENT']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
            print(f"role-name=TDRGithubActionsDeployLambda{os.environ['INPUT_ENVIRONMENT'].title()}", file=fh)
        shell: python
      - id: account-number-secret-name
        env:
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          import os
          env = os.environ['INPUT_ENVIRONMENT']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
            print(f"account-number-secret-name={env.upper()}_ACCOUNT_NUMBER", file=fh)
        shell: python
      - name: Configure AWS credentials for Lambda
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: arn:aws:iam::${{ (inputs.environment == 'prod' && secrets.PROD_ACCOUNT_NUMBER) || (inputs.environment == 'staging' && secrets.STAGING_ACCOUNT_NUMBER) || secrets.INTG_ACCOUNT_NUMBER }}:role/${{ steps.role-name.outputs.role-name }}
          aws-region: eu-west-2
          role-session-name: ECRLogin
      - name: run lambda function
        env:
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_CONSIGNMENT_ID: ${{ inputs.consignmentId }}
          INPUT_START_DATE_TIME: ${{ inputs.startDateTime }}
          INPUT_END_DATE_TIME: ${{ inputs.endDateTime }}
          INPUT_REPORT_TYPE: ${{ inputs.reportType }}
          GITHUB_ACTOR_VALUE: ${{ github.actor }}
        run: |
          case "$INPUT_ENVIRONMENT" in
            intg|staging|prod)
                echo "Environment '$INPUT_ENVIRONMENT' is valid."
                ;;
            *)
              echo "ERROR: Unrecognised environment '$INPUT_ENVIRONMENT'. Allowed values: intg, staging, prod."
              exit 1
              ;;
          esac
          PAYLOAD=$(jq -n \
          --arg env   "$INPUT_ENVIRONMENT" \
          --arg cid   "$INPUT_CONSIGNMENT_ID" \
          --arg start "$INPUT_START_DATE_TIME" \
          --arg end   "$INPUT_END_DATE_TIME" \
          --arg type  "$INPUT_REPORT_TYPE" \
          --arg user  "$GITHUB_ACTOR_VALUE" \
          '{userName: $user, reportType: $type, environment: $env, consignmentId: $cid, startDateTime: $start, endDateTime: $end}')
          aws lambda invoke --function-name tdr-reporting-${{ inputs.environment }} --cli-read-timeout 0 --cli-binary-format raw-in-base64-out --payload "$PAYLOAD" response.json
